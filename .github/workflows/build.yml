on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # A fork has no signing secrets, and an unsigned build is still worth having, so signing is
      # skipped instead of failing the whole run
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_FILE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build
        run: ./gradlew assembleRelease

      - name: Find APK
        id: apk
        run: echo "path=$(ls app/build/outputs/apk/release/*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks
          # Don't pin a build-tools version, the runner image decides which ones exist
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -c -v 4 "${{ steps.apk.outputs.path }}"
          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            "${{ steps.apk.outputs.path }}"

      - name: Report signing state
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::notice::No KEYSTORE_FILE secret, uploading the APK unsigned. Add the signing secrets to publish an installable build from CI."

      - run: cp "${{ steps.apk.outputs.path }}" volume-manager.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: volume-manager.apk
          archive: false
